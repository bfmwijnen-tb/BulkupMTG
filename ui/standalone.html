<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BulkupMTG</title>
<style>
  :root {
    --bg: #0e0f15;
    --bg-2: #14161f;
    --panel: #191c26;
    --panel-2: #212533;
    --line: #2b3040;
    --line-soft: #232735;
    --text: #eceef5;
    --muted: #8f96ad;
    --dim: #666e85;
    --accent: #f0b429;
    --accent-2: #ffd166;
    --good: #4ade80;
    --bad: #f87171;
    --r: 12px;
    --shadow: 0 8px 28px rgba(0,0,0,.42);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #333849 var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* A very soft top glow keeps the page from reading as a flat black slab. */
  body::before {
    content: ''; position: fixed; inset: 0 0 auto 0; height: 340px; pointer-events: none;
    background: radial-gradient(900px 300px at 22% -60px, rgba(240,180,41,.10), transparent 70%);
  }

  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 13px 22px; background: rgba(20,22,31,.86); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30;
  }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .brand span { color: var(--accent); }
  .brand small {
    display: block; font-size: 11px; font-weight: 500; color: var(--dim);
    letter-spacing: .02em; margin-top: -2px;
  }
  .spacer { flex: 1; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 14px; cursor: pointer; font: inherit; font-size: 13.5px;
    transition: .14s;
  }
  button:hover:not(:disabled) { background: #2a2f40; border-color: #3b4257; }
  button:disabled { opacity: .45; cursor: default; }
  main { padding: 22px; max-width: 1560px; margin: 0 auto; position: relative; }
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line); border-radius: var(--r); padding: 17px; margin-bottom: 18px;
  }
  .drop {
    border: 2px dashed var(--line); border-radius: var(--r); padding: 28px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .16s;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent); color: var(--text);
    background: rgba(240,180,41,.05);
  }
  .drop b { color: var(--text); }
  .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .chip {
    display: flex; align-items: center; gap: 8px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 20px; padding: 5px 8px 5px 13px; font-size: 12.5px;
  }
  .chip .x { cursor: pointer; color: var(--dim); border: 0; background: none; padding: 0 4px; font-size: 15px; }
  .chip .x:hover { color: var(--bad); }

  .controls { display: flex; gap: 8px 20px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  select, input[type=number] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px; font: inherit; font-size: 13.5px;
  }
  select:focus, input:focus { outline: 2px solid rgba(240,180,41,.4); outline-offset: 1px; }
  input[type=number] { width: 64px; }
  .pips { display: flex; gap: 4px; }
  .pip {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
    cursor: pointer; font-size: 11px; font-weight: 800; display: grid; place-items: center;
    background: var(--panel-2); color: var(--dim); padding: 0; transition: .13s;
  }
  .pip.on { color: #14151c; border-color: transparent; transform: scale(1.06); }
  .pip[data-c=W].on { background: #f6efdc; } .pip[data-c=U].on { background: #86bdea; }
  .pip[data-c=B].on { background: #ab9fb3; } .pip[data-c=R].on { background: #ee9280; }
  .pip[data-c=G].on { background: #8bcb9e; } .pip[data-c=C].on { background: #bcc0cc; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 15px; }
  .card {
    display: flex; gap: 13px; background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line); border-radius: var(--r); padding: 13px; cursor: pointer;
    transition: .16s; position: relative; overflow: hidden;
  }
  /* Rank-coloured spine: gold for the leaders, fading out down the list. */
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: var(--lead, 0);
  }
  .card:hover { border-color: #4a5168; transform: translateY(-2px); box-shadow: var(--shadow); }
  .card img.art {
    width: 78px; height: 109px; object-fit: cover; object-position: center 18%;
    border-radius: 7px; background: var(--panel-2); flex: none;
  }
  .card .body { min-width: 0; flex: 1; }
  .card .name { font-weight: 650; font-size: 14.5px; margin-bottom: 6px; letter-spacing: -.01em; }
  .rank { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 6px; font-weight: 500; }
  .own-tick { color: var(--good); }
  .stats { display: flex; gap: 11px; font-size: 12.5px; color: var(--muted); align-items: baseline; white-space: nowrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .score { color: var(--accent); font-weight: 750; font-size: 15.5px; font-variant-numeric: tabular-nums; }
  .ci { margin-left: auto; display: flex; gap: 3px; }
  .ci i {
    width: 15px; height: 15px; border-radius: 50%; font-style: normal; font-size: 9px;
    font-weight: 800; display: grid; place-items: center; color: #14151c;
  }
  .ci i[data-c=W] { background: #f6efdc; } .ci i[data-c=U] { background: #86bdea; }
  .ci i[data-c=B] { background: #ab9fb3; } .ci i[data-c=R] { background: #ee9280; }
  .ci i[data-c=G] { background: #8bcb9e; } .ci i[data-c=C] { background: #bcc0cc; }

  /* Deck-readiness meter: owned, then basics you certainly have, then the gap. */
  .meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 9px; background: var(--panel-2); }
  .meter i { display: block; height: 100%; }
  .meter .own { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .meter .basic { background: #4b5570; }
  .note { font-size: 12px; color: var(--dim); margin-top: 7px; }
  .note b { color: var(--muted); font-weight: 600; }
  .empty { text-align: center; padding: 60px 20px; color: var(--dim); }

  .pbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 9px; }
  .pbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  #progress { display: none; }
  #progress.on { display: block; }

  /* hover preview */
  #peek {
    position: fixed; z-index: 200; pointer-events: none; display: none;
    width: 300px; border-radius: 15px; box-shadow: 0 16px 44px rgba(0,0,0,.7);
    border: 1px solid rgba(255,255,255,.10);
  }
  #peek.on { display: block; }

  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(5,6,10,.86);
    z-index: 50; overflow-y: auto; padding: 26px 16px;
  }
  #overlay.on { display: block; }
  .sheet {
    max-width: 1340px; margin: 0 auto; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  }
  .sheet header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 15px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    border-radius: 16px 16px 0 0; position: sticky; top: -26px; z-index: 5;
  }
  .sheet header h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .sheet .inner { padding: 20px; }
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 13px; }
  .mini .thumb { position: relative; }
  .mini img {
    width: 100%; border-radius: 8px; display: block; background: var(--panel-2);
    aspect-ratio: 488/680; transition: .14s;
  }
  .mini:hover img { transform: scale(1.03); }
  .mini.miss img { opacity: .2; filter: grayscale(1); }
  .mini .tag {
    position: absolute; top: 6px; right: 6px; background: var(--good); color: #06210f;
    font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
  }
  .mini .syn {
    position: absolute; bottom: 6px; left: 6px; background: rgba(6,8,13,.88);
    font-size: 10.5px; padding: 2px 6px; border-radius: 5px; font-variant-numeric: tabular-nums;
  }
  .mini .syn.neg { color: var(--dim); }
  .mini .cname { font-size: 11.5px; color: var(--dim); margin-top: 5px; line-height: 1.32; height: 2.64em; overflow: hidden; }
  .mini .cname b { color: var(--text); font-weight: 600; }
  .mini .src { color: var(--good); }

  .kv { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .kv div {
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 9px 14px; min-width: 104px;
  }
  .kv div b { color: var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; display: block; line-height: 1.25; }
  .kv div span { display: block; color: var(--dim); font-size: 11.5px; }
  .legend { font-size: 12.5px; color: var(--dim); margin-bottom: 15px; max-width: 78ch; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 17px; z-index: 100; display: none; font-size: 13.5px; max-width: 90vw;
    box-shadow: var(--shadow);
  }
  .toast.on { display: block; }
  #boot { text-align: center; padding: 90px 20px; color: var(--dim); }
  .hint { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">Bulkup<span>MTG</span><small>commander decks hiding in your bulk</small></h1>
  <div class="spacer"></div>
  <span id="cachenote" class="hint"></span>
  <button id="btn-update" title="Fetch commanders released since this file was built">Check for new commanders</button>
</header>

<main>
  <div id="boot">Unpacking card data…</div>

  <div id="app" style="display:none">
    <div class="panel" id="progress">
      <b id="p-phase">Working…</b> <span id="p-msg" class="hint"></span>
      <div class="pbar"><i id="p-bar" style="width:0"></i></div>
    </div>

    <div class="panel">
      <div class="drop" id="drop">
        <b>Drop your Archidekt bulk exports here</b> — or click to choose. Several files welcome.
      </div>
      <input type="file" id="file" multiple accept=".txt,.csv" hidden>
      <div class="files" id="files"></div>
    </div>

    <div class="panel">
      <div class="controls">
        <label>Card pool
          <select id="pool" title="Which cards count as belonging to this commander">
            <option value="played">Most played</option>
            <option value="synergy">Highest synergy</option>
            <option value="deck">Average decklist</option>
          </select>
        </label>
        <label>Pool size <input type="number" id="topn" value="100" min="10" max="400" step="10"></label>
        <label>Min. owned <input type="number" id="min" value="40" min="0" max="400" step="1"></label>
        <label><input type="checkbox" id="nolands"> Exclude lands</label>
        <label>Rank by
          <select id="sort">
            <option value="synergy">Synergy score</option>
            <option value="hits">Cards owned</option>
            <option value="ready">Deck readiness</option>
          </select>
        </label>
        <label><input type="checkbox" id="owned"> Only commanders I own</label>
        <label>Colours <span class="pips" id="pips"></span></label>
        <div class="spacer"></div>
        <span class="hint" id="count"></span>
      </div>
    </div>

    <div id="results" class="grid"></div>
    <div id="empty" class="empty">Drop your bulk exports above to see which commanders you can build.</div>
  </div>
</main>

<img id="peek" alt="">

<div id="overlay"><div class="sheet">
  <header>
    <h2 id="d-name">—</h2>
    <div class="spacer"></div>
    <a id="d-link" target="_blank" rel="noopener"><button>Scryfall</button></a>
    <button id="d-close">Close</button>
  </header>
  <div class="inner">
    <div class="kv" id="d-kv"></div>
    <div class="legend" id="d-legend"></div>
    <div class="cardgrid" id="d-cards"></div>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script id="bundle" type="application/octet-stream">__BUNDLE__</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const STAPLE_SYNERGY = 2;      // percent; matches the Rust scorer
const DECK_SIZE = 99;
const STORE_KEY = 'bulkup-extra-commanders';

let DATA = null;
let collection = new Map();
let files = [];
let selectedColors = new Set();
let collectionVersion = 0;   // bumped whenever the loaded files change
let lastSig = null;          // guards against redundant re-renders (see render)

// ---------- name normalisation (port of src/names.rs) ----------

const FACE_SEP = ' // ';
const ELIDED = "'’.꞉";

const deaccent = s => s.normalize('NFD').replace(/[̀-ͯ᪰-᫿⃐-⃿]/g, '');

function normaliseFace(s) {
  let out = '', pending = false;
  for (const ch of deaccent(s).toLowerCase()) {
    if (ch >= 'a' && ch <= 'z' || ch >= '0' && ch <= '9') {
      if (pending && out) out += ' ';
      pending = false;
      out += ch;
    } else if (!ELIDED.includes(ch)) {
      pending = true;
    }
  }
  return out;
}

const key = n => n.split(FACE_SEP).map(normaliseFace).filter(Boolean).join('/');
const frontKey = n => normaliseFace(n.split(FACE_SEP)[0]);
const slug = n => frontKey(n).replace(/ /g, '-');

// ---------- bulk parsing (port of src/bulk.rs) ----------

const LINE_RE = /^\s*(\d+)\s+(.+?)\s*(?:\(([A-Za-z0-9]{2,6})\)\s+(\S+))?\s*(?:\*[FE]\*)?\s*$/;
const HEADERS = new Set(['commander', 'sideboard', 'deck', 'maybeboard', 'companion', 'tokens']);

function parseFile(text) {
  const out = { lines: 0, cards: 0, unparsed: [], entries: [] };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/^﻿/, '').trim();
    if (!line) continue;
    if (HEADERS.has(line.replace(/:$/, '').toLowerCase())) continue;
    out.lines++;
    const m = LINE_RE.exec(line);
    if (!m || !m[2].trim()) { out.unparsed.push(line); continue; }
    const qty = parseInt(m[1], 10) || 1;
    out.cards += qty;
    out.entries.push([m[2].trim(), qty]);
  }
  return out;
}

function rebuildCollection() {
  collectionVersion++;
  collection = new Map();
  for (const f of files) {
    for (const [name, qty] of f.entries) {
      const k = key(name);
      let e = collection.get(k);
      if (!e) { e = { name, qty: 0, sources: new Map() }; collection.set(k, e); }
      e.qty += qty;
      e.sources.set(f.name, (e.sources.get(f.name) || 0) + qty);
    }
  }
  // Aliases only after every file is counted, so none freezes a stale quantity.
  for (const [k, card] of [...collection]) {
    const fk = frontKey(card.name);
    if (fk && fk !== k && !collection.has(fk)) collection.set(fk, card);
  }
}

const ownedCard = name => collection.get(key(name)) || collection.get(frontKey(name));

// ---------- the card pool ----------

/// Which cards count as "belonging to" a commander, and in what order.
///
/// * played  — most-played first. What EDHREC's own page leads with, but the
///             head of the list is dominated by format staples.
/// * synergy — biggest gap versus the colour-identity baseline first. Surfaces
///             the cards that are actually *about* this commander.
/// * deck    — only cards in EDHREC's average decklist, i.e. an actual deck
///             somebody would sleeve up. No arbitrary cutoff.
function poolFor(m, opts) {
  let list = m.entries;
  if (opts.pool === 'deck') {
    const inDeck = new Set(m.avgDeck);
    list = list.filter(e => inDeck.has(e[0]));
  }
  if (opts.noLands) list = list.filter(e => !DATA.cards[e[0]][2]);
  if (opts.pool === 'synergy') list = [...list].sort((a, b) => b[1] - a[1]);
  return opts.pool === 'deck' ? list : list.slice(0, opts.topN);
}

// ---------- scoring (port of src/score.rs) ----------

function scoreCommander(c, opts) {
  const m = {
    name: c[0], uuid: c[1], colors: c[2], deckCount: c[3],
    entries: c[4], avgDeck: c[5], basics: c[6] || 0,
  };
  const pool = poolFor(m, opts);

  let hits = 0, stapleHits = 0, synergy = 0;
  const bySource = new Map();
  for (const [ci, syn] of pool) {
    const owned = ownedCard(DATA.cards[ci][0]);
    if (!owned) continue;
    hits++;
    if (syn > 0) synergy += syn / 100;
    if (syn <= STAPLE_SYNERGY) stapleHits++;
    for (const src of owned.sources.keys()) bySource.set(src, (bySource.get(src) || 0) + 1);
  }

  // Deck readiness counts the basics too. A Commander deck is 99 cards and a
  // chunk of that is basic land nobody needs to go find — ignoring them makes
  // every mono-coloured commander look far less buildable than it is.
  let avgOwned = 0;
  for (const ci of m.avgDeck) if (ownedCard(DATA.cards[ci][0])) avgOwned++;
  const ready = m.avgDeck.length
    ? Math.min(1, (avgOwned + m.basics) / DECK_SIZE)
    : 0;

  return Object.assign(m, {
    poolSize: pool.length, hits, stapleHits, synergy,
    avgOwned, avgTotal: m.avgDeck.length, ready,
    ownsCommander: !!ownedCard(m.name), bySource,
  });
}

/// Does a commander's colour identity pass the pip filter?
///
/// Coloured commanders pass when their identity fits inside the selection, so
/// picking W+U gives mono-white, mono-blue and Azorius. Colourless commanders
/// have an empty identity, which is a subset of everything — without a pip of
/// their own they would leak into every filter and could never be isolated, so
/// they answer to C instead.
function colorsAllow(ci) {
  if (!ci) return selectedColors.has('C');
  return ![...ci].some(ch => !selectedColors.has(ch));
}

function readOpts() {
  return {
    pool: $('#pool').value,
    topN: Math.max(10, parseInt($('#topn').value, 10) || 100),
    noLands: $('#nolands').checked,
    min: parseInt($('#min').value, 10) || 0,
    sort: $('#sort').value,
    ownedOnly: $('#owned').checked,
  };
}

function rank(opts) {
  const out = [];
  for (const c of DATA.commanders) {
    if (opts.ownedOnly && !ownedCard(c[0])) continue;
    if (selectedColors.size && !colorsAllow(c[2] || '')) continue;
    const m = scoreCommander(c, opts);
    if (m.hits < opts.min) continue;
    out.push(m);
  }
  out.sort((a, b) =>
    (opts.sort === 'hits' ? b.hits - a.hits :
     opts.sort === 'ready' ? b.ready - a.ready : 0)
    || b.synergy - a.synergy
    || a.name.localeCompare(b.name));
  return out;
}

// ---------- rendering ----------

const img = (uuid, size) => uuid
  ? `https://cards.scryfall.io/${size}/front/${uuid[0]}/${uuid[1]}/${uuid}.jpg`
  : '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, ms = 4000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms);
}

function render() {
  const opts = readOpts();

  // Skip the rebuild when nothing that affects the output has changed.
  //
  // Without this, leaving a number field fires `change` on blur even when the
  // value is unchanged, which replaces every card between a click's mousedown
  // and mouseup — the browser then fires no click at all, so the first click
  // after typing a threshold is silently swallowed.
  const sig = JSON.stringify([opts, [...selectedColors].sort(),
    collectionVersion, DATA.commanders.length]);
  if (sig === lastSig) return;
  lastSig = sig;

  const matches = rank(opts);
  const res = $('#results'), empty = $('#empty');

  $('#count').textContent = collection.size
    ? `${matches.length} of ${DATA.commanders.length.toLocaleString()} commanders`
    : '';

  if (!collection.size) {
    res.innerHTML = '';
    empty.textContent = 'Drop your bulk exports above to see which commanders you can build.';
    return;
  }
  if (!matches.length) {
    res.innerHTML = '';
    empty.textContent = 'Nothing clears the threshold. Lower "Min. owned", or add more bulk files.';
    return;
  }
  empty.textContent = '';
  const max = Math.max(...matches.map(m => m.synergy), 0.0001);

  res.innerHTML = matches.slice(0, 300).map((m, i) => {
    const real = m.hits - m.stapleHits;
    const ci = [...(m.colors || 'C')].map(c => `<i data-c="${c}">${c}</i>`).join('');
    const src = [...m.bySource].sort((a, b) => b[1] - a[1])
      .map(([f, n]) => `${n} in ${esc(f.replace(/\.[^.]+$/, ''))}`).join(' · ');
    const ownPct = m.avgTotal ? m.avgOwned / DECK_SIZE * 100 : 0;
    const basicPct = m.avgTotal ? m.basics / DECK_SIZE * 100 : 0;
    return `<div class="card" data-i="${i}" style="--lead:${(1 - i / 12).toFixed(2)}">
      <img class="art" loading="lazy" src="${img(m.uuid, 'small')}" data-big="${img(m.uuid, 'normal')}"
           alt="" onerror="this.style.visibility='hidden'">
      <div class="body">
        <div class="name"><span class="rank">${i + 1}</span>${esc(m.name)}${
          m.ownsCommander ? ' <span class="own-tick" title="You own this commander">✔</span>' : ''}</div>
        <div class="stats">
          <span class="score">${m.synergy.toFixed(1)}</span>
          <span><b>${m.hits}</b>/${m.poolSize}</span>
          <span><b>${real}</b> real</span>
          <span class="ci">${ci}</span>
        </div>
        <div class="meter" title="${m.avgOwned} owned + ${m.basics} basics of ${DECK_SIZE}">
          <i class="own" style="width:${ownPct.toFixed(1)}%"></i>
          <i class="basic" style="width:${basicPct.toFixed(1)}%"></i>
        </div>
        <div class="note">${m.avgTotal
          ? `<b>${Math.round(m.ready * 100)}%</b> of a deck — ${m.avgOwned} owned + ${m.basics} basics`
          : 'no average deck'}${src ? ' · ' + src : ''}</div>
      </div>
    </div>`;
  }).join('');
  res._matches = matches;
}

function openDetail(m) {
  const opts = readOpts();
  const pool = poolFor(m, opts);
  const inPool = new Set(pool.map(e => e[0]));

  $('#d-name').textContent = m.name;
  $('#d-link').href = 'https://scryfall.com/search?q=' + encodeURIComponent('!"' + m.name + '"');
  $('#d-kv').innerHTML = `
    <div><b>${Math.round(m.ready * 100)}%</b><span>deck ready</span></div>
    <div><b>${m.synergy.toFixed(1)}</b><span>synergy score</span></div>
    <div><b>${m.hits}/${m.poolSize}</b><span>of the pool owned</span></div>
    <div><b>${m.hits - m.stapleHits}</b><span>non-staple hits</span></div>
    ${m.avgTotal ? `<div><b>${m.avgOwned}+${m.basics}</b><span>owned + basics of 99</span></div>` : ''}
    <div><b>${m.deckCount.toLocaleString()}</b><span>decks on EDHREC</span></div>
    <div><b>${m.ownsCommander ? 'Yes' : 'No'}</b><span>commander owned</span></div>`;

  $('#d-legend').innerHTML =
    `Showing the <b>${esc($('#pool').selectedOptions[0].textContent.toLowerCase())}</b> pool` +
    (opts.pool === 'deck' ? '' : ` (top ${opts.topN})`) +
    (opts.noLands ? ', lands excluded' : '') +
    `. Cards you own are highlighted; the rest are dimmed. The percentage is EDHREC's synergy —
     how much more this commander plays a card than its colours generally do, so staples sit near zero.
     Deck readiness counts the ${m.basics} basic lands the average deck runs, which you already own.`;

  $('#d-cards').innerHTML = m.entries
    .filter(e => inPool.has(e[0]))
    .map(([ci, syn]) => {
      const [name, uuid, isLand] = DATA.cards[ci];
      const owned = ownedCard(name);
      const src = owned ? [...owned.sources.keys()].map(f => f.replace(/\.[^.]+$/, '')).join(', ') : '';
      return `<div class="mini ${owned ? '' : 'miss'}">
        <div class="thumb">
          <img loading="lazy" src="${img(uuid, 'normal')}" data-big="${img(uuid, 'normal')}"
               alt="${esc(name)}" onerror="this.style.visibility='hidden'">
          ${owned ? `<span class="tag">${owned.qty > 1 ? owned.qty + '×' : 'own'}</span>` : ''}
          <span class="syn ${syn < 0 ? 'neg' : ''}">${syn}%</span>
        </div>
        <div class="cname" title="${esc(name)}"><b>${esc(name)}</b>${
          src ? `<br><span class="src">${esc(src)}</span>` : ''}</div>
      </div>`;
    }).join('');
  $('#overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function renderFiles() {
  const distinct = new Set([...collection.values()].map(c => c.name)).size;
  $('#files').innerHTML = files.map(f => `
    <span class="chip">
      <b>${esc(f.name)}</b> ${f.cards} cards
      ${f.unparsed.length ? `<span style="color:var(--bad)" title="${esc(f.unparsed.slice(0, 8).join('\n'))}">${f.unparsed.length} unread</span>` : ''}
      <button class="x" data-f="${esc(f.name)}">&times;</button>
    </span>`).join('')
    + (files.length ? `<span class="chip" style="background:none;border-style:dashed">${
        files.reduce((n, f) => n + f.cards, 0)} cards, ${distinct} distinct</span>` : '');
}

async function addFiles(list) {
  for (const f of list) {
    const text = await f.text();
    const parsed = parseFile(text);
    files = files.filter(x => x.name !== f.name);
    files.push({ name: f.name, ...parsed });
  }
  rebuildCollection();
  renderFiles();
  render();
}

// ---------- hover preview ----------

const peek = $('#peek');
function movePeek(e) {
  const w = 300, h = 419, pad = 16;
  let x = e.clientX + 22, y = e.clientY - h / 2;
  if (x + w + pad > innerWidth) x = e.clientX - w - 22;
  y = Math.max(pad, Math.min(y, innerHeight - h - pad));
  peek.style.left = x + 'px';
  peek.style.top = y + 'px';
}
document.addEventListener('mouseover', e => {
  const img = e.target.closest('img[data-big]');
  if (!img || !img.dataset.big) return;
  peek.src = img.dataset.big;
  peek.classList.add('on');
  movePeek(e);
});
document.addEventListener('mousemove', e => { if (peek.classList.contains('on')) movePeek(e); });
document.addEventListener('mouseout', e => {
  if (e.target.closest('img[data-big]')) peek.classList.remove('on');
});

// ---------- update ----------

async function checkForNew() {
  const btn = $('#btn-update');
  btn.disabled = true;
  $('#progress').classList.add('on');
  const setP = (phase, msg, done, total) => {
    $('#p-phase').textContent = phase;
    $('#p-msg').textContent = msg;
    $('#p-bar').style.width = total ? (done / total * 100).toFixed(1) + '%' : '0';
  };

  try {
    setP('Scryfall', 'listing legal commanders…', 0, 0);
    const known = new Set(DATA.commanders.map(c => key(c[0])));
    const fresh = [];
    let url = 'https://api.scryfall.com/cards/search?q=' +
      encodeURIComponent('is:commander legal:commander') + '&unique=cards';
    let page = 0;
    while (url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error('Scryfall returned ' + r.status);
      const j = await r.json();
      for (const c of j.data) if (!known.has(key(c.name))) fresh.push(c);
      url = j.has_more ? j.next_page : null;
      setP('Scryfall', `page ${++page} — ${fresh.length} new so far`, 0, 0);
      await new Promise(r => setTimeout(r, 120));
    }
    if (!fresh.length) { toast('Already up to date — no new commanders.'); return; }

    const added = [];
    for (let i = 0; i < fresh.length; i++) {
      const c = fresh[i];
      setP('EDHREC', c.name, i, fresh.length);
      try {
        const r = await fetch(`https://json.edhrec.com/pages/commanders/${slug(c.name)}.json`);
        if (r.ok) {
          const lists = (await r.json())?.container?.json_dict?.cardlists || [];
          const seen = new Set();
          const entries = [];
          let deckCount = 0;
          for (const l of lists) {
            for (const cv of (l.cardviews || [])) {
              if (cv.name === c.name || seen.has(cv.name)) continue;
              seen.add(cv.name);
              deckCount = Math.max(deckCount, cv.potential_decks || 0);
              entries.push([cv.name, Math.round((cv.synergy || 0) * 100),
                Math.round((cv.num_decks || 0) / Math.max(cv.potential_decks || 1, 1) * 100)]);
            }
          }
          if (entries.length) {
            entries.sort((a, b) => b[2] - a[2]);
            const u = c.image_uris?.normal || c.card_faces?.[0]?.image_uris?.normal || '';
            added.push({
              name: c.name,
              uuid: u ? u.split('/').pop().split('.')[0] : '',
              colors: (c.color_identity || []).join(''),
              deckCount, entries,
            });
          }
        }
      } catch (e) { /* skip this one, keep going */ }
      await new Promise(r => setTimeout(r, 350));   // EDHREC has no public API
    }

    mergeAdded(added);
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(added.concat(loadStored())));
    } catch (e) {
      toast(`Added ${added.length}, but they could not be saved — they will be gone on reload.`);
    }
    toast(`Added ${added.length} new commander${added.length === 1 ? '' : 's'}.`);
    render();
  } catch (e) {
    toast('Update failed: ' + e.message);
  } finally {
    btn.disabled = false;
    $('#progress').classList.remove('on');
    updateCacheNote();
  }
}

function mergeAdded(added) {
  const byName = new Map(DATA.cards.map((c, i) => [c[0], i]));
  const intern = n => {
    let i = byName.get(n);
    if (i === undefined) { i = DATA.cards.length; DATA.cards.push([n, '', 0]); byName.set(n, i); }
    return i;
  };
  const known = new Set(DATA.commanders.map(c => key(c[0])));
  for (const a of added) {
    if (known.has(key(a.name))) continue;
    // No average deck for freshly fetched commanders, so readiness stays blank
    // until the file is regenerated.
    DATA.commanders.push([a.name, a.uuid, a.colors, a.deckCount,
      a.entries.map(([n, s, incl]) => [intern(n), s, incl]), [], 0]);
  }
  DATA.commanders.sort((x, y) => x[0].localeCompare(y[0]));
}

const loadStored = () => {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (e) { return []; }
};

function updateCacheNote() {
  $('#cachenote').textContent =
    `${DATA.commanders.length.toLocaleString()} commanders · ${DATA.generated}`;
}

// ---------- boot ----------

async function inflateBundle(b64) {
  const resp = await fetch('data:application/octet-stream;base64,' + b64);
  const stream = resp.body.pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

(async () => {
  try {
    DATA = await inflateBundle($('#bundle').textContent.trim());
  } catch (e) {
    $('#boot').innerHTML = 'Could not unpack the card data.<br>' +
      'This page needs a current browser (Chrome, Edge or Firefox).<br><small>' + esc(e.message) + '</small>';
    return;
  }
  const stored = loadStored();
  if (stored.length) mergeAdded(stored);

  $('#boot').style.display = 'none';
  $('#app').style.display = '';
  updateCacheNote();

  $('#pips').innerHTML = [['W', 'White'], ['U', 'Blue'], ['B', 'Black'], ['R', 'Red'],
    ['G', 'Green'], ['C', 'Colourless']]
    .map(([c, t]) => `<button class="pip" data-c="${c}" title="${t}">${c}</button>`).join('');
  $('#pips').addEventListener('click', e => {
    const b = e.target.closest('.pip'); if (!b) return;
    const c = b.dataset.c;
    selectedColors.has(c) ? selectedColors.delete(c) : selectedColors.add(c);
    b.classList.toggle('on', selectedColors.has(c));
    render();
  });

  const drop = $('#drop');
  drop.addEventListener('click', () => $('#file').click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    addFiles(e.dataTransfer.files);
  });
  $('#file').addEventListener('change', e => addFiles(e.target.files));
  $('#files').addEventListener('click', e => {
    const b = e.target.closest('.x'); if (!b) return;
    files = files.filter(f => f.name !== b.dataset.f);
    rebuildCollection(); renderFiles(); render();
  });

  // The average-decklist pool has no cutoff, so the size box is meaningless there.
  const syncPool = () => { $('#topn').disabled = $('#pool').value === 'deck'; };
  $('#pool').addEventListener('change', syncPool);
  syncPool();

  for (const id of ['#min', '#sort', '#owned', '#pool', '#topn', '#nolands']) {
    $(id).addEventListener('change', render);
    // Update as the number fields are typed in, rather than only on blur.
    $(id).addEventListener('input', render);
  }

  $('#results').addEventListener('click', e => {
    const c = e.target.closest('.card');
    if (c) openDetail($('#results')._matches[+c.dataset.i]);
  });
  const close = () => { $('#overlay').classList.remove('on'); document.body.style.overflow = ''; };
  $('#d-close').addEventListener('click', close);
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('#btn-update').addEventListener('click', checkForNew);

  render();
})();
</script>
