name: Release

# Tag a commit to publish binaries:
#   git tag v0.1.0 && git push origin v0.1.0
# The workflow can also be started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: bulkup.exe
          - label: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bin: bulkup
          - label: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bin: bulkup
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: bulkup

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../bulkup-${{ matrix.label }}.zip" ./*
          else
            zip -r "../bulkup-${{ matrix.label }}.zip" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bulkup-${{ matrix.label }}
          path: bulkup-${{ matrix.label }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bulkup-*.zip
          generate_release_notes: true
