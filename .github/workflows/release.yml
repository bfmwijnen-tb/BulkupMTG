name: Release

# Tag a commit to publish binaries:
#   git tag v0.1.0 && git push origin v0.1.0
# The workflow can also be started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v0.1.0. The tag is created for you."
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: bulkup.exe
          - label: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bin: bulkup
          - label: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bin: bulkup
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: bulkup

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../bulkup-${{ matrix.label }}.zip" ./*
          else
            zip -r "../bulkup-${{ matrix.label }}.zip" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bulkup-${{ matrix.label }}
          path: bulkup-${{ matrix.label }}.zip

  # The standalone page needs a crawled cache to embed, which CI does not have,
  # so it is built locally and attached by hand. Kept as a reminder of the two
  # shipping formats.

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Run by hand, `tag` names the version and the action creates the tag from
      # the checked-out commit. Triggered by a tag push, that ref is used as-is.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: bulkup-*.zip
          generate_release_notes: true
