[package]
name = "bulkup"
version = "0.1.0"
edition = "2021"
description = "Find Commander decks hiding in your MTG bulk"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.1"
chrono = "0.4"
flate2 = "1"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
